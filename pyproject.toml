[project]
name = "finpulse"
version = "0.1.0"
description = "FinPulse transaction analytics platform (SDD demo)"
requires-python = ">=3.11"
dependencies = [
    "faker>=24.0",
    "boto3>=1.34",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
